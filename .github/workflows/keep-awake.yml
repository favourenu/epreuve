# Backup for the server's own keep-awake ping (backend/app/keepalive.py): requests the
# site from outside every 10 minutes, so a free Render service that did fall asleep
# is woken up again. GitHub may run scheduled jobs a few minutes late.
# Set the repository variable KEEP_AWAKE_URL to override the address.
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: |
          url="${{ vars.KEEP_AWAKE_URL || 'https://epreuve.site' }}/api/health"
          # A sleeping service can take up to a minute to start.
          curl --silent --show-error --fail --retry 2 --max-time 90 "$url" \
            || echo "::warning::$url did not respond"
